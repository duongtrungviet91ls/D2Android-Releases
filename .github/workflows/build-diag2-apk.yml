name: Build diagnostic APK 2 (Wine SEH + Box64 logging)

# Builds a second diagnostic D2Android APK from this branch: on top of the
# round-1 diagnostic branch (DXVK logging at info), the Wine debug setting
# is widened to "+err,+seh" (exception channel) and Box64 logging is
# enabled, so a silently dying game session leaves evidence.
# Runs on GitHub's Linux runners because the local build VM blocks
# the loopback TCP the Gradle daemon needs.
# The APK is signed with a throwaway keystore generated inside the run, so
# it installs as a one-off test build (uninstall the official app first,
# and export your saves before uninstalling).

on:
  workflow_dispatch:
  push:
    branches: [diag/wine-seh-logging]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            zstd gcc-aarch64-linux-gnu gcc-mingw-w64-i686 \
            binutils-mingw-w64-i686 libasound2-dev libx11-dev \
            python3-zstandard unzip xz-utils file

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # No setup-android action: its v3 tries to install the legacy 'tools'
      # package that Google removed, which fails the job. The ubuntu-24.04
      # runner image already ships an Android SDK, but sdkmanager is not on
      # PATH, so it is located dynamically under $ANDROID_HOME below.
      - name: Install Android SDK components
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -1)"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;34.0.0" \
            "ndk;24.0.8215888" "cmake;3.22.1" "platform-tools"

      - name: Fetch third-party parts and build runtime + mod
        working-directory: source
        run: |
          bash tools/fetch-winlator101.sh
          bash tools/collect-licenses.sh
          bash tools/build-runtime.sh --public
          bash tools/build-mod.sh

      - name: Generate throwaway signing keystore
        run: |
          PASS="$(openssl rand -base64 24)"
          echo "$PASS" > "$RUNNER_TEMP/keystore-password.txt"
          keytool -genkeypair -storetype PKCS12 \
            -keystore "$RUNNER_TEMP/d2android-ci.p12" \
            -alias d2android -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$PASS" \
            -dname "CN=D2Android Custom Build, O=Personal" -noprompt

      - name: Build release APK
        working-directory: source/winlator
        run: |
          ./gradlew assembleRelease --stacktrace \
            -Pd2VersionName=1.5.4-diag2 -Pd2VersionCode=42 \
            -Pd2ReleaseKeystore="$RUNNER_TEMP/d2android-ci.p12" \
            -Pd2ReleaseKeystorePassword="$(cat "$RUNNER_TEMP/keystore-password.txt")"

      - name: Show APK info
        run: |
          APK=$(find source/winlator/app/build/outputs/apk -name "*.apk" | head -1)
          echo "APK: $APK"
          ls -la "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging "$APK" | head -5
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK" | head -5

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: d2android-1.5.4-diag2-apk
          path: source/winlator/app/build/outputs/apk/release/*.apk
          retention-days: 14
          if-no-files-found: error
